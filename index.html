<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117;
    --surface:#16181f;
    --surface2:#1e2130;
    --border:#2a2d3e;
    --accent:#4f8ef7;
    --accent2:#a78bfa;
    --text:#e8eaf0;
    --muted:#6b7280;
    --danger:#f87171;
    --success:#34d399;
    --cell-h:108px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}

  /* Layout */
  body{display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid var(--border);
    background:var(--surface);gap:12px;position:sticky;top:0;z-index:20;
  }
  .topbar-left{display:flex;align-items:center;gap:16px}
  .app-title{font-size:1rem;font-weight:700;letter-spacing:-.3px;color:var(--text)}
  .live-time{
    font-family:'DM Mono',monospace;font-size:.82rem;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:5px 10px;color:var(--accent);letter-spacing:.5px;
  }
  .time-src{font-size:.7rem;color:var(--muted);margin-left:4px}

  .nav-group{display:flex;align-items:center;gap:8px}
  .month-label{font-weight:600;font-size:.95rem;min-width:160px;text-align:center}
  .btn{
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:.85rem;font-weight:500;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:var(--border)}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-accent:hover{background:#3d7de8}
  .btn-glow{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;font-weight:600;
    box-shadow:0 0 16px rgba(79,142,247,0.35);
    position:relative;overflow:hidden;
  }
  .btn-glow::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
    transform:translateX(-100%);transition:transform .4s;
  }
  .btn-glow:hover::after{transform:translateX(100%)}
  .btn-glow:hover{box-shadow:0 0 24px rgba(79,142,247,.55)}

  /* Main */
  main{flex:1;padding:20px 28px;max-width:1100px;width:100%;margin:0 auto}

  .dow-row{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;
  }
  .dow{
    text-align:center;font-size:.72rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:6px 0;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

  /* Cell */
  .cell{
    min-height:var(--cell-h);background:var(--surface);
    border:1px solid var(--border);border-radius:10px;
    padding:8px;cursor:pointer;display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    transition:border-color .15s,box-shadow .15s;
  }
  .cell:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cell.out{opacity:.3}
  .cell.today{
    border-color:var(--accent);
    background:linear-gradient(160deg,rgba(79,142,247,.08),var(--surface));
  }
  .cell.today .date-num{
    background:var(--accent);color:#fff;
    width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .date-num{font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:auto}
  .dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .dot{width:7px;height:7px;border-radius:50%}
  .task-pills{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .pill{
    font-size:.65rem;font-weight:500;padding:2px 6px;border-radius:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;opacity:.9;
  }

  /* Today panel */
  .today-panel-backdrop{
    position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);
    backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:flex-end;
    padding:80px 28px 20px 28px;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .today-panel-backdrop.open{opacity:1;pointer-events:all}
  .today-panel{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;width:380px;max-height:75vh;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:translateY(20px);transition:transform .25s cubic-bezier(.16,1,.3,1);
  }
  .today-panel-backdrop.open .today-panel{transform:translateY(0)}
  .panel-header{
    padding:16px 18px 12px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-header h3{font-size:1rem;font-weight:700}
  .panel-date{font-size:.78rem;color:var(--muted)}
  .panel-close{
    background:var(--surface2);border:1px solid var(--border);
    color:var(--muted);width:28px;height:28px;border-radius:6px;
    cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  }
  .panel-body{overflow-y:auto;padding:12px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
  .panel-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:24px 0}
  .panel-task{
    border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;
    position:relative;overflow:hidden;
  }
  .panel-task::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor;opacity:.8;
  }
  .panel-task-time{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;opacity:.75}
  .panel-task-title{font-size:.88rem;font-weight:600;color:#fff}
  .panel-task-desc{font-size:.77rem;opacity:.7;color:#fff;margin-top:2px}
  .panel-task.active-now{
    box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
    animation:pulse-task 2s ease-in-out infinite;
  }
  @keyframes pulse-task{
    0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
    50%{box-shadow:0 0 0 2px rgba(255,255,255,.3) inset}
  }
  .now-badge{
    font-size:.62rem;font-weight:700;background:#fff;color:#000;
    border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:16px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;width:520px;max-width:100%;padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .modal-head h2{font-size:1rem;font-weight:700}
  .tasks-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .m-task{
    border-radius:10px;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  .m-task .meta{flex:1}
  .m-task .time{font-family:'DM Mono',monospace;font-size:.75rem;font-weight:500;opacity:.8;margin-bottom:3px;color:#fff}
  .m-task .ttl{font-weight:600;font-size:.88rem;color:#fff}
  .m-task .dsc{font-size:.78rem;opacity:.7;color:#fff;margin-top:3px}
  .m-task .acts{display:flex;flex-direction:column;gap:4px}
  .sm-btn{
    font-family:inherit;font-size:.72rem;padding:4px 8px;border-radius:5px;cursor:pointer;font-weight:500;
    background:rgba(255,255,255,.12);border:none;color:#fff;transition:background .15s;
  }
  .sm-btn:hover{background:rgba(255,255,255,.22)}
  .sm-btn.del{background:rgba(248,113,113,.2);color:var(--danger)}
  .sm-btn.del:hover{background:rgba(248,113,113,.35)}

  /* Add form */
  .add-form{
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .add-form h4{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .form-row{display:flex;gap:8px}
  input[type="text"],input[type="time"],textarea,select{
    font-family:inherit;font-size:.85rem;padding:8px 10px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);width:100%;transition:border-color .15s;
  }
  input[type="text"]:focus,input[type="time"]:focus,textarea:focus{
    outline:none;border-color:var(--accent);
  }
  textarea{resize:vertical;min-height:50px}
  .form-actions{display:flex;justify-content:flex-end;gap:8px}

  /* Edit inline */
  .edit-wrap{
    background:var(--surface2);border:1px solid var(--accent);border-radius:10px;
    padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;
  }

  .dot-count{
    position:absolute;top:8px;right:8px;
    font-size:.6rem;font-weight:700;background:var(--accent);color:#fff;
    width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="app-title">📅 Calendar</div>
    <div class="live-time" id="liveTime">--:--:-- <span class="time-src" id="timeSrc"></span></div>
  </div>
  <div class="nav-group">
    <button class="btn" id="prev">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="btn" id="next">›</button>
    <button class="btn" id="todayNav">Today</button>
    <button class="btn btn-glow" id="openPanel">⚡ Tasks Now</button>
  </div>
</div>

<main>
  <div class="dow-row" id="dowRow">
    <div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div>
    <div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</main>

<!-- Today Panel -->
<div class="today-panel-backdrop" id="panelBackdrop">
  <div class="today-panel">
    <div class="panel-header">
      <div>
        <h3>Today's Tasks</h3>
        <div class="panel-date" id="panelDate"></div>
      </div>
      <button class="panel-close" id="closePanel">×</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'calendar.tasks.v2';
  let tasks = [];
  let realNow = null; // {date, time offset from system}
  let systemOffsetMs = 0; // offset: realTime = Date.now() + systemOffsetMs
  let viewDate = new Date();

  // ── Time ──────────────────────────────────────────────────────────────────
  // Fetch the TRUE local datetime using the device's own timezone.
  // We ask the API for the time in the local IANA timezone so we get
  // the correct local time regardless of UTC offset.
  async function fetchOnlineTime() {
    // Get local IANA timezone string e.g. "Asia/Manila"
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const apis = [
      `https://timeapi.io/api/time/current/zone?timeZone=${encodeURIComponent(tz)}`,
      `https://worldtimeapi.org/api/timezone/${encodeURIComponent(tz)}`
    ];
    for (const url of apis) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        if (!r.ok) continue;
        const d = await r.json();
        // timeapi.io returns dateTime as local time in the requested zone
        // worldtimeapi returns datetime as local time in the requested zone
        let iso = d.dateTime || d.datetime;
        if (!iso) continue;
        // The API gives us the TRUE local time in our timezone.
        // Compute how far off our system clock is from that.
        const apiLocalMs = new Date(iso).getTime();
        const sysMs = Date.now();
        systemOffsetMs = apiLocalMs - sysMs;
        document.getElementById('timeSrc').textContent = '(online ✓)';
        return true;
      } catch (e) {}
    }
    // Fallback: system clock is fine for local time already
    systemOffsetMs = 0;
    document.getElementById('timeSrc').textContent = '(local)';
    return false;
  }

  function getRealNow() {
    return new Date(Date.now() + systemOffsetMs);
  }

  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function todayISO() {
    return fmtDate(getRealNow());
  }

  // ── Live clock ─────────────────────────────────────────────────────────────
  function updateClock() {
    const now = getRealNow();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    const dateStr = now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    document.getElementById('liveTime').innerHTML =
      `${h}:${m}:${s} <span style="color:var(--muted);font-size:.7rem">${dateStr}</span> <span class="time-src" id="timeSrc">${document.getElementById('timeSrc')?.textContent||''}</span>`;
    checkTitleUpdate();
  }
  setInterval(updateClock, 1000);

  // ── Dynamic Title ──────────────────────────────────────────────────────────
  function checkTitleUpdate() {
    const now = getRealNow();
    const iso = fmtDate(now);
    const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    // Find tasks whose time matches current HH:MM and date is today
    const active = tasks.filter(t => t.date === iso && t.time === hhmm);
    if (active.length > 0) {
      document.title = `⏰ ${active[0].title} — Calendar`;
    } else {
      // Check if there's a task happening "now" within next hour
      const upcoming = tasks.filter(t => {
        if (t.date !== iso) return false;
        const [th,tm] = t.time.split(':').map(Number);
        const taskMins = th*60+tm;
        const nowMins = now.getHours()*60+now.getMinutes();
        return taskMins > nowMins && taskMins - nowMins <= 15;
      });
      if (upcoming.length > 0) {
        document.title = `🔔 Soon: ${upcoming[0].title} — Calendar`;
      } else {
        document.title = 'Calendar';
      }
    }
  }

  // ── Storage ────────────────────────────────────────────────────────────────
  const uid = () => Math.random().toString(36).slice(2,9);
  const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : null;
    } catch(e) { tasks = null; }
    if (!tasks || !Array.isArray(tasks) || tasks.length === 0) {
      tasks = exampleTasks();
      persist();
    }
  }
  function exampleTasks() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const make = (day,title,desc,time) => ({
      id: uid(),
      date: new Date(y,m,day).toISOString().slice(0,10),
      title, desc, time,
      color: randomColor()
    });
    return [
      make(3,'Team Sync','Discuss sprint goals','09:30'),
      make(3,'Doctor','Check-up appointment','14:00'),
      make(7,'Project Review','Quarterly review with stakeholders','11:00'),
      make(15,'Birthday Reminder','Send gift to Alex','00:00'),
      make(new Date(y,m+1,0).getDate(),'Launch Day','Product launch celebration','16:00')
    ];
  }
  function randomColor() {
    const palettes = [
      '#4f8ef7','#a78bfa','#34d399','#f59e0b','#f87171',
      '#38bdf8','#fb7185','#a3e635','#c084fc','#2dd4bf'
    ];
    return palettes[Math.floor(Math.random()*palettes.length)];
  }

  // ── Calendar Render ────────────────────────────────────────────────────────
  function render() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const y = viewDate.getFullYear(), mo = viewDate.getMonth();
    const first = new Date(y, mo, 1);
    const startDay = first.getDay();
    const daysInMonth = new Date(y, mo+1, 0).getDate();
    const prevLast = new Date(y, mo, 0).getDate();
    const totalCells = Math.ceil((startDay + daysInMonth)/7)*7;
    const today = todayISO();

    document.getElementById('monthLabel').textContent =
      first.toLocaleString(undefined,{month:'long',year:'numeric'});

    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startDay + 1;
      let cellDate;
      let isOut = false;
      if (dayNum <= 0) {
        isOut = true;
        cellDate = new Date(y, mo-1, prevLast+dayNum);
      } else if (dayNum > daysInMonth) {
        isOut = true;
        cellDate = new Date(y, mo+1, dayNum-daysInMonth);
      } else {
        cellDate = new Date(y, mo, dayNum);
      }
      const iso = fmtDate(cellDate);
      const dayTasks = tasks.filter(t => t.date === iso).sort((a,b) => a.time.localeCompare(b.time));

      const cell = document.createElement('div');
      cell.className = 'cell' + (isOut?' out':'') + (iso===today?' today':'');

      // Date number
      const dn = document.createElement('div');
      dn.className = 'date-num';
      dn.textContent = cellDate.getDate();
      cell.appendChild(dn);

      // Task pills (max 2)
      if (dayTasks.length) {
        const pills = document.createElement('div');
        pills.className = 'task-pills';
        dayTasks.slice(0,2).forEach(t => {
          const p = document.createElement('div');
          p.className = 'pill';
          p.style.background = t.color;
          p.textContent = t.time + ' ' + t.title;
          pills.appendChild(p);
        });
        if (dayTasks.length > 2) {
          const more = document.createElement('div');
          more.style.cssText = 'font-size:.62rem;color:var(--muted);padding:1px 6px';
          more.textContent = `+${dayTasks.length-2} more`;
          pills.appendChild(more);
        }
        cell.appendChild(pills);
        // count badge
        if (dayTasks.length > 0) {
          const badge = document.createElement('div');
          badge.className = 'dot-count';
          badge.textContent = dayTasks.length;
          cell.appendChild(badge);
        }
      }

      cell.addEventListener('click', () => openModal(iso));
      grid.appendChild(cell);
    }
  }

  // ── Today Panel ────────────────────────────────────────────────────────────
  const panelBackdrop = document.getElementById('panelBackdrop');
  document.getElementById('openPanel').addEventListener('click', () => {
    renderPanel();
    panelBackdrop.classList.add('open');
  });
  document.getElementById('closePanel').addEventListener('click', () => panelBackdrop.classList.remove('open'));
  panelBackdrop.addEventListener('click', e => { if (e.target===panelBackdrop) panelBackdrop.classList.remove('open'); });

  function renderPanel() {
    const iso = todayISO();
    const now = getRealNow();
    const nowMins = now.getHours()*60+now.getMinutes();
    const dayTasks = tasks.filter(t => t.date===iso).sort((a,b)=>a.time.localeCompare(b.time));

    document.getElementById('panelDate').textContent =
      now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    const body = document.getElementById('panelBody');
    body.innerHTML = '';

    if (!dayTasks.length) {
      body.innerHTML = '<div class="panel-empty">No tasks scheduled for today 🎉</div>';
      return;
    }

    dayTasks.forEach(t => {
      const [th,tm] = t.time.split(':').map(Number);
      const taskMins = th*60+tm;
      const isNow = taskMins === nowMins;
      const isPast = taskMins < nowMins;
      const isSoon = !isPast && !isNow && taskMins - nowMins <= 15;

      const box = document.createElement('div');
      box.className = 'panel-task' + (isNow?' active-now':'');
      box.style.background = t.color+'22';
      box.style.color = t.color;
      box.style.borderLeft = `3px solid ${t.color}`;
      box.style.opacity = isPast ? '0.45' : '1';

      const timeEl = document.createElement('div');
      timeEl.className = 'panel-task-time';
      timeEl.innerHTML = t.time + (isNow ? '<span class="now-badge">NOW</span>' : '') +
        (isSoon ? '<span class="now-badge" style="background:var(--accent)">SOON</span>' : '') +
        (isPast ? ' ✓' : '');

      const titleEl = document.createElement('div');
      titleEl.className = 'panel-task-title';
      titleEl.textContent = t.title;

      box.appendChild(timeEl);
      box.appendChild(titleEl);
      if (t.desc) {
        const descEl = document.createElement('div');
        descEl.className = 'panel-task-desc';
        descEl.textContent = t.desc;
        box.appendChild(descEl);
      }
      body.appendChild(box);
    });
  }

  // Refresh panel every minute if open
  setInterval(() => {
    if (panelBackdrop.classList.contains('open')) renderPanel();
  }, 30000);

  // ── Modal ──────────────────────────────────────────────────────────────────
  let activeModal = null;
  function closeModal() {
    if (!activeModal) return;
    document.removeEventListener('keydown', activeModal.onKey);
    activeModal.el.remove();
    activeModal = null;
  }

  function openModal(dateISO) {
    closeModal();
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.addEventListener('click', e => { if(e.target===backdrop) closeModal(); });

    const modal = document.createElement('div');
    modal.className = 'modal';
    backdrop.appendChild(modal);

    // Header
    const head = document.createElement('div');
    head.className = 'modal-head';
    const d = new Date(dateISO+'T00:00:00');
    const h2 = document.createElement('h2');
    h2.textContent = d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
    const closeBtn = document.createElement('button');
    closeBtn.className = 'panel-close';
    closeBtn.textContent = '×';
    closeBtn.addEventListener('click', closeModal);
    head.appendChild(h2); head.appendChild(closeBtn);
    modal.appendChild(head);

    // Tasks list
    const tasksList = document.createElement('div');
    tasksList.className = 'tasks-list';
    modal.appendChild(tasksList);

    function refreshList() {
      tasksList.innerHTML = '';
      const list = tasks.filter(t=>t.date===dateISO).sort((a,b)=>a.time.localeCompare(b.time));
      if (!list.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:var(--muted);font-size:.85rem;padding:8px 0';
        empty.textContent = 'No tasks yet. Add one below.';
        tasksList.appendChild(empty);
        return;
      }
      list.forEach(t => {
        const box = document.createElement('div');
        box.className = 'm-task';
        box.style.background = t.color+'22';
        box.style.borderLeft = `3px solid ${t.color}`;

        const meta = document.createElement('div'); meta.className = 'meta';
        const time = document.createElement('div'); time.className = 'time'; time.textContent = t.time;
        const ttl = document.createElement('div'); ttl.className = 'ttl'; ttl.textContent = t.title;
        meta.appendChild(time); meta.appendChild(ttl);
        if (t.desc) {
          const dsc = document.createElement('div'); dsc.className = 'dsc'; dsc.textContent = t.desc;
          meta.appendChild(dsc);
        }

        const acts = document.createElement('div'); acts.className = 'acts';
        const editBtn = document.createElement('button'); editBtn.className = 'sm-btn'; editBtn.textContent = 'Edit';
        const delBtn = document.createElement('button'); delBtn.className = 'sm-btn del'; delBtn.textContent = 'Delete';
        acts.appendChild(editBtn); acts.appendChild(delBtn);

        editBtn.addEventListener('click', () => showEdit(t, box, refreshList));
        delBtn.addEventListener('click', () => {
          if (confirm(`Delete "${t.title}"?`)) {
            tasks = tasks.filter(x => x.id !== t.id);
            persist(); refreshList(); render();
          }
        });
        box.appendChild(meta); box.appendChild(acts);
        tasksList.appendChild(box);
      });
    }
    refreshList();

    // Add form
    const addForm = document.createElement('div');
    addForm.className = 'add-form';
    addForm.innerHTML = '<h4>Add Task</h4>';

    const row1 = document.createElement('div'); row1.className = 'form-row';
    const titleIn = document.createElement('input'); titleIn.type='text'; titleIn.placeholder='Task title';
    const timeIn = document.createElement('input'); timeIn.type='time'; timeIn.style.maxWidth='120px';
    row1.appendChild(titleIn); row1.appendChild(timeIn);
    addForm.appendChild(row1);

    const descIn = document.createElement('textarea'); descIn.placeholder='Description (optional)';
    addForm.appendChild(descIn);

    const formActions = document.createElement('div'); formActions.className = 'form-actions';
    const addBtn = document.createElement('button'); addBtn.className = 'btn btn-accent'; addBtn.textContent = 'Add Task';
    formActions.appendChild(addBtn);
    addForm.appendChild(formActions);

    addBtn.addEventListener('click', () => {
      if (!titleIn.value.trim() || !timeIn.value) return;
      tasks.push({ id:uid(), date:dateISO, title:titleIn.value.trim(), desc:descIn.value.trim(), time:timeIn.value, color:randomColor() });
      persist(); refreshList(); render();
      titleIn.value=''; descIn.value=''; timeIn.value='';
    });
    modal.appendChild(addForm);

    const onKey = e => { if(e.key==='Escape') closeModal(); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(backdrop);
    activeModal = { el: backdrop, onKey };
  }

  function showEdit(task, container, refreshList) {
    const existing = document.querySelector('.edit-wrap');
    if (existing) existing.remove();

    const wrap = document.createElement('div');
    wrap.className = 'edit-wrap';

    const r1 = document.createElement('div'); r1.className = 'form-row';
    const tIn = document.createElement('input'); tIn.type='text'; tIn.value=task.title;
    const tmIn = document.createElement('input'); tmIn.type='time'; tmIn.value=task.time; tmIn.style.maxWidth='120px';
    r1.appendChild(tIn); r1.appendChild(tmIn);

    const dIn = document.createElement('textarea'); dIn.value=task.desc;

    const colorRow = document.createElement('div');
    colorRow.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)';
    colorRow.innerHTML = 'Color: ';
    const colorPicker = document.createElement('input'); colorPicker.type='color';
    colorPicker.value = task.color.startsWith('#') ? task.color : '#4f8ef7';
    colorRow.appendChild(colorPicker);

    const acts = document.createElement('div'); acts.className = 'form-actions';
    const saveBtn = document.createElement('button'); saveBtn.className='btn btn-accent'; saveBtn.textContent='Save';
    const cancelBtn = document.createElement('button'); cancelBtn.className='btn'; cancelBtn.textContent='Cancel';
    acts.appendChild(cancelBtn); acts.appendChild(saveBtn);

    wrap.appendChild(r1); wrap.appendChild(dIn); wrap.appendChild(colorRow); wrap.appendChild(acts);
    container.insertAdjacentElement('afterend', wrap);

    cancelBtn.addEventListener('click', () => wrap.remove());
    saveBtn.addEventListener('click', () => {
      task.title = tIn.value.trim() || task.title;
      task.time = tmIn.value || task.time;
      task.desc = dIn.value;
      task.color = colorPicker.value;
      persist(); wrap.remove(); refreshList(); render();
    });
  }

  // ── Navigation ──────────────────────────────────────────────────────────────
  document.getElementById('prev').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1); render();
  });
  document.getElementById('next').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1); render();
  });
  document.getElementById('todayNav').addEventListener('click', () => {
    viewDate = getRealNow(); render();
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  load();
  fetchOnlineTime().then(() => {
    viewDate = getRealNow();
    render();
    updateClock();
  });
  render();
  updateClock();

})();
</script>
</body>
</html>
